openapi: 3.2.0
info:
  version: 1.0.0
  title: Datamuse Pets API
  description: A word-finding tool for developers
  termsOfService: http://www.datamuse.com/api/
  contact:
    name: Datamuse API Team
    url: http://www.onelook.com/?c=about&sel=api#feedback
  license:
    name: MIT
    url: http://github.com/gruntjs/grunt/blob/master/LICENSE-MIT
servers:
- url: http://api.datamuse.com
- url: https://api.datamuse.com
tags:
- name: Pets
paths:
  /pets/{id}:
    get:
      description: Returns a user based on a single ID, if the user does not have access to the pet
      operationId: findPetById
      parameters:
      - name: id
        in: path
        description: ID of pet to fetch
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: pet response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Pets
      summary: Find pet by id
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: find pet by id
    delete:
      description: deletes a single pet based on the ID supplied
      operationId: deletePet
      parameters:
      - name: id
        in: path
        description: ID of pet to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: pet deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Pets
      summary: Delete pet
      x-summary-source: derived
components:
  schemas:
    NewPet:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        tag:
          type: string
    Pet:
      type: object
      allOf:
      - $ref: '#/components/schemas/NewPet'
      - required:
        - id
        properties:
          id:
            type: integer
            format: int64
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
x-provenance:
  method: harvested
  publisher: Datamuse
  source: https://www.datamuse.com/api/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
