openapi: 3.2.0
info:
  version: 1.0.0
  title: Datamuse Words API
  description: A word-finding tool for developers
  termsOfService: http://www.datamuse.com/api/
  contact:
    name: Datamuse API Team
    url: http://www.onelook.com/?c=about&sel=api#feedback
  license:
    name: MIT
    url: http://github.com/gruntjs/grunt/blob/master/LICENSE-MIT
servers:
- url: http://api.datamuse.com
- url: https://api.datamuse.com
tags:
- name: Words
paths:
  /words:
    get:
      description: Gets words
      operationId: findPets
      parameters:
      - name: tags
        in: query
        description: tags to filter by
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: maximum number of results to return
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: pet response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Words
      summary: Find pets
      x-summary-source: derived
    post:
      description: Creates a new pet in the store. Duplicates are allowed
      operationId: addPet
      responses:
        '200':
          description: pet response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
        description: Pet to add to the store
        required: true
      tags:
      - Words
      summary: Add pet
      x-summary-source: derived
components:
  schemas:
    NewPet:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        tag:
          type: string
    Pet:
      type: object
      allOf:
      - $ref: '#/components/schemas/NewPet'
      - required:
        - id
        properties:
          id:
            type: integer
            format: int64
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
x-provenance:
  method: harvested
  publisher: Datamuse
  source: https://www.datamuse.com/api/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
