aid: datamuse
name: Datamuse
description: >-
  Datamuse operates a word-finding query engine and lexical search service for developers, educators, and
  creative-writing applications. The Datamuse API exposes a /words endpoint that finds words matching a rich combination
  of semantic, phonetic, orthographic, and vocabulary constraints (means-like, sounds-like, spelled-like, synonyms,
  antonyms, hypernyms, meronyms, triggers, rhymes, homophones, and more) plus a /sug autocomplete endpoint. Free for
  non-commercial use up to 100,000 requests per day with no API key required; commercial use, custom vocabularies, and
  higher rate limits are available via a paid commercial agreement. Datamuse also runs OneLook, OneLook Thesaurus,
  RhymeZone, Rimar.io, and CivicSearch — consumer-facing word search tools built on the same lexical infrastructure.
